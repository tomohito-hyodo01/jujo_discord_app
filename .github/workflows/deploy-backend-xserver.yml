name: Deploy Backend & Bot to X-Server

on:
  push:
    branches:
      - main
    paths:
      - 'apps/tournament_activity/backend/**'
      - 'apps/form_bot/**'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.XSERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 10022 -H sv13283.xserver.jp >> ~/.ssh/known_hosts || true

      - name: Deploy Backend to X-Server
        run: |
          # X-Serverへの接続が一時的にタイムアウトしてデプロイが落ちることがあるため、
          # rsync / ssh は数回リトライする
          retry() {
            local n=1 max=3 delay=20
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                echo "❌ ${max}回試行しましたが失敗しました: $1"
                return 1
              fi
              echo "⚠️ 失敗 (試行 ${n}/${max})。${delay}秒後に再試行します..."
              n=$((n + 1))
              sleep "$delay"
            done
          }

          # 既定のTCPタイムアウト(2分超)を待たずに失敗させ、早くリトライへ回す
          SSH_OPTS="-i ~/.ssh/id_rsa -p 10022 -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          # バックエンドコードをアップロード
          retry rsync -avz --delete -e "ssh $SSH_OPTS" \
            --exclude '__pycache__' \
            --exclude '.env' \
            --exclude 'venv' \
            --exclude '*.pyc' \
            --exclude 'fly.toml' \
            --exclude 'Dockerfile' \
            --exclude 'google_sa_key.json' \
            --exclude 'uploads' \
            --exclude 'uvicorn.log' \
            apps/tournament_activity/backend/ \
            fromround@sv13283.xserver.jp:~/api.jujo-softtennis.com/backend/

          # 依存関係のインストールとプロセス再起動
          cat > /tmp/deploy_backend_remote.sh << 'REMOTE'
            cd ~/api.jujo-softtennis.com/backend

            # virtualenvが無ければ作成
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate
            pip install -r requirements.txt --quiet

            # 既存プロセスを停止
            pkill -f "uvicorn api.main:app" || true
            sleep 2

            # .env.xserverを.envとしてコピー（初回のみ）
            if [ ! -f ".env" ] && [ -f ".env.xserver" ]; then
              cp .env.xserver .env
            fi

            # .env読み込み＆バックグラウンドで起動
            set -a && source .env.xserver && set +a
            nohup venv/bin/python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*" > uvicorn.log 2>&1 &

            sleep 3
            if pgrep -f "uvicorn api.main:app" > /dev/null; then
              echo "✅ Backend API started successfully"
            else
              echo "❌ Backend API failed to start"
              cat uvicorn.log
              exit 1
            fi
          REMOTE
          # リダイレクトは関数の内側に置く。retry の外側に書くと、2回目の試行で
          # stdin が枯渇して「空のスクリプトを流して成功」になり、再起動されないまま緑になる
          run_backend_remote() {
            local out
            # コマンドを指定せず stdin を渡す形は変更前のヒアドキュメントと同じ（ログインシェルで実行される）
            out=$(ssh $SSH_OPTS fromround@sv13283.xserver.jp < /tmp/deploy_backend_remote.sh 2>&1) || {
              echo "$out"
              return 1
            }
            echo "$out"
            # 成功マーカーを必須にして「実際には何も実行されず終了コード0」を検出する
            echo "$out" | grep -q "Backend API started successfully"
          }
          retry run_backend_remote

      - name: Verify Backend
        run: |
          sleep 5
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.jujo-softtennis.com/)
          if [ "$response" -eq 200 ]; then
            echo "✅ Backend API is running"
          else
            echo "⚠️ Backend returned HTTP $response"
          fi

  deploy-bot:
    name: Deploy Discord Bot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.XSERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 10022 -H sv13283.xserver.jp >> ~/.ssh/known_hosts || true

      - name: Deploy Bot to X-Server
        run: |
          # X-Serverへの接続が一時的にタイムアウトしてデプロイが落ちることがあるため、
          # rsync / ssh は数回リトライする
          retry() {
            local n=1 max=3 delay=20
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                echo "❌ ${max}回試行しましたが失敗しました: $1"
                return 1
              fi
              echo "⚠️ 失敗 (試行 ${n}/${max})。${delay}秒後に再試行します..."
              n=$((n + 1))
              sleep "$delay"
            done
          }

          # 既定のTCPタイムアウト(2分超)を待たずに失敗させ、早くリトライへ回す
          SSH_OPTS="-i ~/.ssh/id_rsa -p 10022 -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          # Botコードをアップロード
          # bot.log は --delete で消さない（障害時のログを残して原因調査できるようにする）
          retry rsync -avz --delete -e "ssh $SSH_OPTS" \
            --exclude '__pycache__' \
            --exclude '.env' \
            --exclude 'venv' \
            --exclude '*.pyc' \
            --exclude 'fly.toml' \
            --exclude 'Dockerfile' \
            --exclude 'bot.log' \
            apps/form_bot/ \
            fromround@sv13283.xserver.jp:~/api.jujo-softtennis.com/form_bot/

          # 依存関係のインストールとプロセス再起動
          cat > /tmp/deploy_bot_remote.sh << 'REMOTE'
            cd ~/api.jujo-softtennis.com/form_bot

            # 停止〜起動の隙間に keepalive cron が割り込んで bot が二重起動しないよう排他する。
            # flock はプロセス終了時にカーネルが解放するため、ssh切断や強制終了でも
            # ロックが残って復旧不能になることがない（デプロイ時間の長短にも影響されない）。
            LOCKFILE="$HOME/api.jujo-softtennis.com/.bot.lock"
            exec 9>"$LOCKFILE"
            if ! flock -w 120 9; then
              echo "❌ keepaliveとの排他ロックを取得できませんでした"
              exit 1
            fi

            # virtualenvが無ければ作成
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate
            pip install -r requirements.txt --quiet

            # 既存プロセスを停止
            pkill -f "python3 bot.py" || true
            pkill -f "python bot.py" || true
            sleep 2

            # .env.xserverを.envとしてコピー（初回のみ）
            if [ ! -f ".env" ] && [ -f ".env.xserver" ]; then
              cp .env.xserver .env
            fi

            # ログは追記（クラッシュ時の記録を残す）だが、無制限に増えないよう直近分だけ残す
            if [ -f bot.log ]; then
              tail -n 2000 bot.log > bot.log.tmp && mv bot.log.tmp bot.log
            fi
            # 失敗時に「今回の起動分」だけを出せるよう、起動前の行数を控える
            LOG_MARK=$(wc -l < bot.log 2>/dev/null || echo 0)
            echo "===== deploy restart $(date '+%Y-%m-%d %H:%M:%S') =====" >> bot.log

            # バックグラウンドで起動。
            # 9>&- でロックのFDを子に継承させない（継承すると bot が動いている間ずっと
            # ロックが保持され、次のデプロイや keepalive がロック待ちで失敗する）
            nohup venv/bin/python bot.py >> bot.log 2>&1 9>&- &

            sleep 5
            # 'python cleanup_bot.py' のような別プロセスを起動成功と誤判定しないパターン
            if pgrep -f "python.*[/ ]bot\.py" > /dev/null; then
              echo "✅ Discord Bot started successfully"
            else
              echo "❌ Discord Bot failed to start"
              tail -n +"$((LOG_MARK + 1))" bot.log
              exit 1
            fi
          REMOTE
          # リダイレクトは関数の内側に置く。retry の外側に書くと、2回目の試行で
          # stdin が枯渇して「空のスクリプトを流して成功」になり、再起動されないまま緑になる
          run_bot_remote() {
            local out
            # コマンドを指定せず stdin を渡す形は変更前のヒアドキュメントと同じ（ログインシェルで実行される）
            out=$(ssh $SSH_OPTS fromround@sv13283.xserver.jp < /tmp/deploy_bot_remote.sh 2>&1) || {
              echo "$out"
              return 1
            }
            echo "$out"
            # 成功マーカーを必須にして「実際には何も実行されず終了コード0」を検出する
            echo "$out" | grep -q "Discord Bot started successfully"
          }
          retry run_bot_remote
